<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registration - Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #e0e0e0;
    }
    .container {
      background: #1b263b;
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      border: 1px solid #415a77;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #fff;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #415a77;
      border-radius: 8px;
      background: #0d1b2a;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 18px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }
    #status {
      margin-top: 16px;
      text-align: center;
      font-size: 0.9rem;
      color: #94a3b8;
      min-height: 24px;
    }
    .hidden { display: none; }
    #report {
      margin-top: 24px;
      background: #0d1b2a;
      border-radius: 10px;
      padding: 20px;
      border: 1px solid #ef4444;
      display: none;
    }
    #report h2 {
      color: #f87171;
      font-size: 1.2rem;
      margin-bottom: 12px;
    }
    #report pre {
      background: #1e293b;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      overflow-x: auto;
      white-space: pre-wrap;
      color: #e2e8f0;
      line-height: 1.5;
    }
    .warning {
      background: #7f1d1d;
      color: #fecaca;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      text-align: center;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Event Registration</h1>
    <p class="subtitle">Please fill in your details to continue</p>

    <form id="regForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required placeholder="John Doe" autocomplete="name">

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">

      <label for="designation">Designation</label>
      <select id="designation" name="designation" required>
        <option value="" disabled selected>Select your designation</option>
        <option value="Student">Student</option>
        <option value="Working Professional">Working Professional</option>
      </select>

      <button type="submit" id="submitBtn">Submit Registration</button>
    </form>

    <div id="status"></div>

    <div id="report">
      <div class="warning">⚠️ DEMO: Data that would be silently collected &amp; emailed</div>
      <h2>Collected Information</h2>
      <pre id="reportContent"></pre>
      <button id="mailtoBtn" style="margin-top:16px;background:#10b981;">Open Email Client (mailto demo)</button>
    </div>

    <p class="footer-note">
      This is a cybersecurity awareness demonstration.<br>
      No data is stored on any server. All collection happens in your browser.
    </p>
  </div>

  <script>
    const form = document.getElementById('regForm');
    const statusEl = document.getElementById('status');
    const reportEl = document.getElementById('report');
    const reportContent = document.getElementById('reportContent');
    const submitBtn = document.getElementById('submitBtn');
    const mailtoBtn = document.getElementById('mailtoBtn');

    let collectedData = {};

    // Collect browser / device fingerprint (what is actually possible)
    function getDeviceInfo() {
      const info = {
        userAgent: navigator.userAgent,
        platform: navigator.platform || 'unknown',
        language: navigator.language,
        languages: navigator.languages ? navigator.languages.join(', ') : 'n/a',
        hardwareConcurrency: navigator.hardwareConcurrency || 'unknown (cores)',
        deviceMemory: navigator.deviceMemory ? navigator.deviceMemory + ' GB (approx)' : 'not available (Chrome only)',
        screen: `${screen.width}×${screen.height} @ ${screen.colorDepth}-bit`,
        viewport: `${window.innerWidth}×${window.innerHeight}`,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        cookiesEnabled: navigator.cookieEnabled,
        doNotTrack: navigator.doNotTrack || 'unspecified',
        touchPoints: navigator.maxTouchPoints || 0,
        online: navigator.onLine
      };

      // Try WebGL GPU info
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (debugInfo) {
            info.gpuVendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
            info.gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch (e) {
        info.gpu = 'unavailable';
      }

      // Storage estimate (origin quota, NOT full disk)
      if (navigator.storage && navigator.storage.estimate) {
        navigator.storage.estimate().then(est => {
          info.browserStorageQuota = (est.quota / (1024*1024*1024)).toFixed(2) + ' GB (browser origin only)';
          info.browserStorageUsage = (est.usage / (1024*1024)).toFixed(2) + ' MB used';
        }).catch(() => {});
      }

      return info;
    }

    // Get geolocation (requires user permission)
    function getLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve({ error: 'Geolocation not supported by this browser' });
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            resolve({
              latitude: pos.coords.latitude,
              longitude: pos.coords.longitude,
              accuracy: pos.coords.accuracy + ' meters',
              altitude: pos.coords.altitude,
              timestamp: new Date(pos.timestamp).toISOString()
            });
          },
          (err) => {
            resolve({ error: err.message || 'Permission denied or unavailable' });
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusEl.textContent = 'Collecting device & location data… (you may see a permission prompt)';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const designation = document.getElementById('designation').value;

      const device = getDeviceInfo();
      const location = await getLocation();

      collectedData = {
        formData: { name, email, designation },
        location,
        deviceInfo: device,
        collectedAt: new Date().toISOString(),
        note: 'This data was collected purely in the browser. Exact CPU model, exact RAM, and full disk capacity are intentionally blocked by browsers for privacy.'
      };

      // Pretty print for the report
      reportContent.textContent = JSON.stringify(collectedData, null, 2);
      reportEl.style.display = 'block';
      statusEl.textContent = 'Data collected successfully. Review the report below.';
      submitBtn.disabled = false;

      // Scroll to report
      reportEl.scrollIntoView({ behavior: 'smooth' });
    });

    // Demo: open mail client with the collected data
    mailtoBtn.addEventListener('click', () => {
      if (!collectedData.formData) return;

      const subject = encodeURIComponent('Cybersecurity Demo – Collected Device Report');
      const body = encodeURIComponent(
`Hello ${collectedData.formData.name},

This is a demonstration email showing what data a website can collect when you fill a form.

=== FORM DATA ===
Name: ${collectedData.formData.name}
Email: ${collectedData.formData.email}
Designation: ${collectedData.formData.designation}

=== LOCATION ===
${JSON.stringify(collectedData.location, null, 2)}

=== DEVICE / BROWSER FINGERPRINT ===
${JSON.stringify(collectedData.deviceInfo, null, 2)}

Collected at: ${collectedData.collectedAt}

---
This is part of a cybersecurity awareness demonstration.
No data was sent to any external server.
`
      );

      // Open the user's default email client addressed to the email they entered
      window.location.href = `mailto:${collectedData.formData.email}?subject=${subject}&body=${body}`;
    });
  </script>
</body>
</html>
